name: PHP Syntax Check

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          files=$(find . -type f -name '*.php' -not -path './.git/*' -not -path './uploads/*')
          test -n "$files"
          while IFS= read -r file; do
            php -l "$file"
          done <<< "$files"
